[mypy]
python_version = 3.11
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = (?x)(/tests/|/migrations/)
plugins = sqlalchemy.ext.mypy.plugin
# SQLModel/SQLAlchemy stubs disagree with Field(), exec(), Row["col"], ConfigDict,
# and RepositoryBase type vars. These codes are stub noise on every table=True
# model — not a skip of untyped defs. var-annotated is left on (real misses).
disable_error_code = call-overload, attr-defined, assignment, union-attr, no-any-return, arg-type, return-value, type-var, no-redef

[mypy-src._overrides.pydantic.optional]
# create_model decorator; stubs cannot express the runtime types.
ignore_errors = True
