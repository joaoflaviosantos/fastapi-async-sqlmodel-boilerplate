[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = src
pythonpath = .
# Collects apps/<app>/<subapp>/tests and core/tests. .agents/examples stays outside.
# Several subapps ship tests/test_v1.py. importlib keeps those modules distinct;
# prepend would collide the name and break `from tests.helper import ...`.
addopts = --strict-markers --import-mode=importlib
markers =
    unit: Isolated tests without HTTP. Must not require Testcontainers/Docker.
    integration: HTTP/API tests using the session-scoped client fixture. Files must be named *_vN.py.
filterwarnings =
    ignore:The signature of the `AbstractPage.create` method has changed.:DeprecationWarning
