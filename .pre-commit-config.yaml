default_language_version:
  python: python3.11

repos:
  - repo: local
    hooks:
      - id: ruff-format-local
        name: ruff format
        entry: bash -c 'cd ./backend && poetry run ruff format .'
        language: system
        types: [python]
      - id: ruff-local
        name: ruff
        entry: bash -c 'cd ./backend && poetry run ruff check src'
        language: system
        types: [python]
      - id: unit_test
        name: pytest
        entry: bash -c 'cd ./backend && poetry run pytest -m unit -v'
        language: system
        pass_filenames: false
        always_run: true
