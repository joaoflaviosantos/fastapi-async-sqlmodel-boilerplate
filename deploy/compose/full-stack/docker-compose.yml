# docker compose --env-file backend/.env -f deploy/compose/full-stack/docker-compose.yml --project-name fastapi-async-sqlmodel-boilerplate-prod up -d

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    command: >
      -c "max_connections=100"
      -c "shared_buffers=3GB"
      -c "work_mem=8MB"
      -c "maintenance_work_mem=256MB"
      -c "effective_cache_size=9GB"
      -c "max_wal_size=1GB"
      -c "min_wal_size=80MB"
      -c "checkpoint_timeout=10min"
    container_name: fastapi-async-sqlmodel-boilerplate-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - fastapi_async_sqlmodel_boilerplate_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docker} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: fastapi-async-sqlmodel-boilerplate-redis-prod
    restart: unless-stopped
    # Using REDIS_CACHE_PASSWORD as the single source of truth for the redis container password
    command: redis-server --requirepass ${REDIS_CACHE_PASSWORD:?Set REDIS_CACHE_PASSWORD in backend/.env}
    expose:
      - "6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - fastapi_async_sqlmodel_boilerplate_network_prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Migration (runs once, then exits)
  # ---------------------------------------------------------------------------

  migrate:
    profiles:
      - migrate
    build:
      context: ../../../
      dockerfile: backend/Dockerfile
      target: prod
    image: fastapi-async-sqlmodel-boilerplate-api:latest
    container_name: fastapi-async-sqlmodel-boilerplate-migrate-prod
    env_file:
      - ../../../backend/.env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_CACHE_HOST: redis
      REDIS_BROKER_HOST: redis
      REDIS_BROKER_PASSWORD: ${REDIS_CACHE_PASSWORD}
    command: alembic upgrade head
    networks:
      - fastapi_async_sqlmodel_boilerplate_network_prod
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Reverse Proxy (Caddy — handles HTTPS + TLS automatically)
  # ---------------------------------------------------------------------------

  caddy:
    image: caddy:2-alpine
    container_name: fastapi-async-sqlmodel-boilerplate-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    networks:
      - fastapi_async_sqlmodel_boilerplate_network_prod
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ../../../
      dockerfile: backend/Dockerfile
      target: prod
    image: fastapi-async-sqlmodel-boilerplate-api:latest
    container_name: fastapi-async-sqlmodel-boilerplate-api-prod
    restart: always
    env_file:
      - ../../../backend/.env
    environment:
      # Passwords are automatically inherited from backend/.env via env_file.
      # We only need to override the Hosts to point to the docker container names,
      # and ensure the passwords for secondary Redis connections fallback to the cache password.
      POSTGRES_SERVER: postgres
      REDIS_CACHE_HOST: redis
      REDIS_RATE_LIMIT_HOST: redis
      REDIS_RATE_LIMIT_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_QUEUE_HOST: redis
      REDIS_QUEUE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_BROKER_HOST: redis
      REDIS_BROKER_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_PUBSUB_HOST: redis
      REDIS_PUBSUB_PASSWORD: ${REDIS_CACHE_PASSWORD}
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips="*"
    expose:
      - "8000"
    networks:
      - fastapi_async_sqlmodel_boilerplate_network_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    profiles:
      - worker
    build:
      context: ../../../
      dockerfile: backend/Dockerfile
      target: prod
    image: fastapi-async-sqlmodel-boilerplate-api:latest
    container_name: fastapi-async-sqlmodel-boilerplate-celery-worker-prod
    restart: unless-stopped
    env_file:
      - ../../../backend/.env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_CACHE_HOST: redis
      REDIS_RATE_LIMIT_HOST: redis
      REDIS_RATE_LIMIT_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_QUEUE_HOST: redis
      REDIS_QUEUE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_BROKER_HOST: redis
      REDIS_BROKER_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_PUBSUB_HOST: redis
      REDIS_PUBSUB_PASSWORD: ${REDIS_CACHE_PASSWORD}
    command: celery -A src.worker worker --loglevel=info --concurrency=1 --prefetch-multiplier=1
    networks:
      - fastapi_async_sqlmodel_boilerplate_network_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    profiles:
      - scheduler
    build:
      context: ../../../
      dockerfile: backend/Dockerfile
      target: prod
    image: fastapi-async-sqlmodel-boilerplate-api:latest
    container_name: fastapi-async-sqlmodel-boilerplate-celery-beat-prod
    restart: unless-stopped
    env_file:
      - ../../../backend/.env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_CACHE_HOST: redis
      REDIS_RATE_LIMIT_HOST: redis
      REDIS_RATE_LIMIT_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_QUEUE_HOST: redis
      REDIS_QUEUE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_BROKER_HOST: redis
      REDIS_BROKER_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_PUBSUB_HOST: redis
      REDIS_PUBSUB_PASSWORD: ${REDIS_CACHE_PASSWORD}
    command: celery -A src.worker beat --loglevel=info
    networks:
      - fastapi_async_sqlmodel_boilerplate_network_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_flower:
    profiles:
      - observability
    build:
      context: ../../../
      dockerfile: backend/Dockerfile
      target: prod
    image: fastapi-async-sqlmodel-boilerplate-api:latest
    container_name: fastapi-async-sqlmodel-boilerplate-celery-flower-prod
    restart: unless-stopped
    env_file:
      - ../../../backend/.env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_CACHE_HOST: redis
      REDIS_RATE_LIMIT_HOST: redis
      REDIS_RATE_LIMIT_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_QUEUE_HOST: redis
      REDIS_QUEUE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_BROKER_HOST: redis
      REDIS_BROKER_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_PUBSUB_HOST: redis
      REDIS_PUBSUB_PASSWORD: ${REDIS_CACHE_PASSWORD}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?Set FLOWER_BASIC_AUTH=user:password in backend/.env}
    command: celery -A src.worker flower --port=5555 --loglevel=info
    expose:
      - "5555"
    networks:
      - fastapi_async_sqlmodel_boilerplate_network_prod
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data_prod:
  redis_data_prod:
  caddy_data_prod:
  caddy_config_prod:

networks:
  fastapi_async_sqlmodel_boilerplate_network_prod:
    name: fastapi-async-sqlmodel-boilerplate-network-prod
